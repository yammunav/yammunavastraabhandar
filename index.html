<script id="yvb-search-overlay-js">
(function(){
  var PROD_KEY='yammuna_vastraa_final_logo_v2';
  var DEPT_KEY='yvb_departments_v2';
  var RECENT_KEY='yvb_recent_searches';
  function getProducts(){try{var a=JSON.parse(localStorage.getItem(PROD_KEY));return Array.isArray(a)?a:[]}catch(e){return[]}}
  function getDepts(){try{var a=JSON.parse(localStorage.getItem(DEPT_KEY));if(Array.isArray(a))return a.map(function(d){return d.en||d.key||d}).filter(Boolean)}catch(e){}return['Laddu Gopal','Radha Krishna','Mukut','Mala','Shringaar','Singhasan','Bansuri','Hanuman Poshak']}
  function getRecent(){try{var a=JSON.parse(localStorage.getItem(RECENT_KEY));return Array.isArray(a)?a:[]}catch(e){return[]}}
  function saveRecent(q){q=(q||'').trim();if(!q)return;try{var r=getRecent().filter(function(x){return x.toLowerCase()!==q.toLowerCase()});r.unshift(q);localStorage.setItem(RECENT_KEY,JSON.stringify(r.slice(0,8)))}catch(e){}}
  function minPrice(p){try{var vs=p.sizeVariants||[];var ps=vs.map(function(v){return Number(v.price)}).filter(function(n){return n>0});if(ps.length)return Math.min.apply(null,ps)}catch(e){}return null}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function headerInput(){return document.querySelector('header input')}
  function setReactInputValue(input,value){
    try{
      var protoVal=Object.getOwnPropertyDescriptor(Object.getPrototypeOf(input),'value');
      var setter=(protoVal&&protoVal.set)||Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value').set;
      setter.call(input,value);
      input.dispatchEvent(new Event('input',{bubbles:true}));
    }catch(e){ try{input.value=value;input.dispatchEvent(new Event('input',{bubbles:true}))}catch(e2){} }
  }
  var ov=document.createElement('div');
  ov.id='yvb-search-overlay';
  ov.style.cssText='position:fixed;inset:0;z-index:100;background:#ffffff;display:none;flex-direction:column;';
  ov.innerHTML=
   '<div style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:#000;">'+
     '<button id="yvb-s-back" aria-label="Back" style="width:42px;height:48px;color:#fff;font-size:24px;background:none;border:none;flex-shrink:0;">&#8592;</button>'+
     '<div style="flex:1;min-width:0;position:relative;display:flex;align-items:stretch;">'+
       '<span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#888;font-size:18px;pointer-events:none;z-index:2;">&#8981;</span>'+
       '<input id="yvb-s-input" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="Search poshak, mukut, mala..." style="flex:1;min-width:0;height:48px;padding:0 40px 0 42px;border:none;border-radius:9999px 0 0 9999px;font-size:16px;color:#000;outline:none;background:#fff;" />'+
       '<button id="yvb-s-x" aria-label="Clear" style="display:none;position:absolute;right:104px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:none;border-radius:50%;background:#eee;color:#333;font-size:13px;z-index:2;">&#10005;</button>'+
       '<button id="yvb-s-go" style="flex-shrink:0;height:48px;padding:0 20px;border:none;border-radius:0 9999px 9999px 0;background:#fbbf24;color:#000;font-weight:700;font-size:15px;">Search</button>'+
     '</div>'+
   '</div>'+
   '<div id="yvb-s-body" style="flex:1;overflow-y:auto;padding:12px 16px;-webkit-overflow-scrolling:touch;"></div>';
  document.body.appendChild(ov);
  var sInput=ov.querySelector('#yvb-s-input');
  var sBody=ov.querySelector('#yvb-s-body');
  var sX=ov.querySelector('#yvb-s-x');

  function thumbHtml(p){
    var img=(p.images&&p.images[0])||'';
    if(typeof img==='string'&&(img.indexOf('data:')===0||img.indexOf('http')===0)){
      return '<img src="'+img+'" alt="" style="width:46px;height:46px;object-fit:cover;border-radius:8px;background:#f3f3f3;flex-shrink:0;" />';
    }
    return '<div style="width:46px;height:46px;border-radius:8px;background:#fde68a;display:flex;align-items:center;justify-content:center;font-size:20px;color:#92400e;flex-shrink:0;">&#8981;</div>';
  }
  function itemHtml(p){
    var price=minPrice(p);
    var name=p.name_en||p.name_hi||'Item';
    return '<button data-q="'+esc(name)+'" style="display:flex;width:100%;align-items:center;gap:12px;padding:10px 4px;border:none;border-bottom:1px solid #eee;background:#fff;text-align:left;cursor:pointer;">'+
      thumbHtml(p)+
      '<div style="flex:1;min-width:0;"><div style="font-weight:600;font-size:15px;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(name)+'</div>'+
      '<div style="font-size:13px;color:#777;margin-top:2px;">'+esc(p.dept||'')+(price!=null?' \u00B7 from \u20B9'+price:'')+'</div></div>'+
      '<span style="color:#aaa;font-size:18px;flex-shrink:0;">&#8599;</span></button>';
  }
  function chipHtml(q,hot){
    return '<button data-q="'+esc(q)+'" style="padding:8px 14px;border:1px solid #e5e5e5;border-radius:9999px;background:'+(hot?'#fff7e6':'#f7f7f7')+';font-size:14px;color:#111;cursor:pointer;">'+esc(q)+'</button>';
  }
  function renderSuggestions(q){
    q=(q||'').trim(); var ql=q.toLowerCase();
    var prods=getProducts(); var html='';
    if(!q){
      var recent=getRecent();
      if(recent.length){
        html+='<div style="font-weight:700;margin:4px 0 8px;color:#333;font-size:15px;">Recent searches</div><div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;">'+recent.slice(0,6).map(function(r){return chipHtml(r,false)}).join('')+'</div>';
      }
      var depts=getDepts();
      html+='<div style="font-weight:700;margin:4px 0 8px;color:#333;font-size:15px;">Popular categories</div><div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;">'+depts.slice(0,8).map(function(d){return chipHtml(d,true)}).join('')+'</div>';
      if(prods.length){
        html+='<div style="font-weight:700;margin:4px 0 8px;color:#333;font-size:15px;">Popular items</div>'+prods.slice(0,6).map(itemHtml).join('');
      }
    }else{
      html+='<button data-q="'+esc(q)+'" style="display:flex;width:100%;align-items:center;gap:10px;padding:12px 4px;border:none;border-bottom:1px solid #eee;background:#fff;text-align:left;font-size:15px;cursor:pointer;"><span style="color:#888;font-size:17px;">&#8981;</span><span>Search for &quot;<b>'+esc(q)+'</b>&quot;</span></button>';
      var matches=prods.filter(function(p){return ((p.name_en||'')+' '+(p.name_hi||'')+' '+(p.dept||'')).toLowerCase().indexOf(ql)>-1}).slice(0,10);
      if(matches.length){
        html+='<div style="font-weight:700;margin:12px 0 4px;color:#333;font-size:15px;">Items ('+matches.length+')</div>'+matches.map(itemHtml).join('');
      }else{
        html+='<div style="color:#777;padding:20px 0;font-size:14px;">No items found for &ldquo;'+esc(q)+'&rdquo;. Try &ldquo;poshak&rdquo;, &ldquo;mukut&rdquo; or &ldquo;mala&rdquo;.</div>';
      }
    }
    sBody.innerHTML=html;
  }
  sBody.addEventListener('click',function(e){
    var b=e.target.closest?e.target.closest('[data-q]'):null; if(!b)return;
    applySearch(b.getAttribute('data-q'));
  });
  function applySearch(q){
    saveRecent(q);
    var hi=headerInput(); if(hi) setReactInputValue(hi,q);
    sInput.value=q; toggleX();
    closeOverlay();
  }
  function toggleX(){ sX.style.display = sInput.value ? 'block' : 'none'; }
  sInput.addEventListener('input',function(){
    toggleX();
    var hi=headerInput(); if(hi) setReactInputValue(hi,sInput.value);
    renderSuggestions(sInput.value);
  });
  sInput.addEventListener('keydown',function(e){ if(e.key==='Enter'){ applySearch(sInput.value); } });
  sX.addEventListener('click',function(){ sInput.value=''; toggleX(); var hi=headerInput(); if(hi) setReactInputValue(hi,''); renderSuggestions(''); sInput.focus(); });
  ov.querySelector('#yvb-s-back').addEventListener('click',closeOverlay);
  ov.querySelector('#yvb-s-go').addEventListener('click',function(){ applySearch(sInput.value); });
  function openOverlay(){
    var hi=headerInput();
    var cur=hi?hi.value:'';
    ov.style.display='flex';
    document.body.style.overflow='hidden';
    sInput.value=cur; toggleX();
    renderSuggestions(cur);
    setTimeout(function(){ try{sInput.focus()}catch(e){} },60);
  }
  function closeOverlay(){ ov.style.display='none'; document.body.style.overflow=''; }
  function armHeader(){
    var hi=headerInput(); if(!hi||hi.getAttribute('data-yvb-armed'))return;
    hi.setAttribute('data-yvb-armed','1');
    hi.setAttribute('readonly','readonly');
    hi.addEventListener('focus',function(e){ e.preventDefault(); try{hi.blur()}catch(x){} openOverlay(); });
    hi.addEventListener('click',function(){ openOverlay(); });
  }
  armHeader();
  setInterval(armHeader,1200);
})();
</script>
<script>
// COMPREHENSIVE: Accept orders, full image, go to cart only, customer folders
(function(){
  function ensureSerials(){
    try {
      let orders = JSON.parse(localStorage.getItem('yvb_order_history_v2')||'[]');
      let ch=false;
      orders.forEach((o,i)=>{ if(!o.serial){ o.serial=i+1; ch=true; } });
      if(ch) localStorage.setItem('yvb_order_history_v2', JSON.stringify(orders));
    } catch(e){}
  }
  
  window.acceptOrder = function(orderId){
    try {
      let orders = JSON.parse(localStorage.getItem('yvb_order_history_v2')||'[]');
      let order = orders.find(o=>o.id===orderId);
      if(order){
        order.status = 'Accepted';
        order.acceptedAt = new Date().toLocaleString();
        localStorage.setItem('yvb_order_history_v2', JSON.stringify(orders));
        alert('Order #' + (order.serial||'?') + ' Accepted!\nCustomer: ' + (order.customer&&order.customer.name||'Unknown'));
        if(window.renderCF) window.renderCF();
        setTimeout(()=>location.reload(), 800);
      }
    } catch(e){}
  };
  
  window.rejectOrder = function(orderId){
    if(!confirm('Reject this order?')) return;
    try {
      let orders = JSON.parse(localStorage.getItem('yvb_order_history_v2')||'[]');
      let order = orders.find(o=>o.id===orderId);
      if(order){
        order.status = 'Rejected';
        localStorage.setItem('yvb_order_history_v2', JSON.stringify(orders));
        if(window.renderCF) window.renderCF();
        setTimeout(()=>location.reload(), 800);
      }
    } catch(e){}
  };
  
  window.openFullImage = function(src){
    let overlay = document.createElement('div');
    overlay.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;padding:20px;';
    overlay.onclick = function(){ overlay.remove(); };
    overlay.innerHTML = '<img src="' + src + '" style="max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;"><div style="position:absolute;top:20px;right:20px;color:#fff;font-size:28px;">✕</div>';
    document.body.appendChild(overlay);
  };
  
  function enhanceProducts(){
    let iv=setInterval(function(){
      document.querySelectorAll('img').forEach(function(img){
        if(!img.dataset.enhanced && img.classList.contains('object-cover') && img.src && img.src.startsWith('http')){
          img.style.cursor='zoom-in';
          img.dataset.enhanced='true';
          img.addEventListener('click', function(e){
            e.stopPropagation();
            window.openFullImage(this.src);
          });
        }
      });
      document.querySelectorAll('button').forEach(function(btn){
        if(btn.textContent.includes('Order on WhatsApp') && !btn.dataset.fixed){
          let card = btn.closest('div');
          let inCart = btn.closest('[class*="max-w-[420px]"]');
          if(card && !inCart){
            // Check if Add to Cart nearby
            let hasAddCart = false;
            if(card.parentElement){
              card.parentElement.querySelectorAll('button').forEach(function(b){
                if(b.textContent.includes('Add to Cart')) hasAddCart=true;
              });
            }
            if(hasAddCart){
              btn.style.display='none';
              btn.dataset.fixed='true';
            }
          }
        }
      });
    }, 1000);
    setTimeout(function(){ clearInterval(iv); }, 10000);
  }
  
  let cfActive=false;
  function initCF(){
    ensureSerials();
    let tries=0;
    let iv=setInterval(function(){
      tries++;
      if(tries>40){ clearInterval(iv); return; }
      let h2=null;
      document.querySelectorAll('h2').forEach(function(h){
        if(h.textContent.includes('Order History')) h2=h;
      });
      if(!h2) return;
      if(document.getElementById('cf-btn')){ clearInterval(iv); return; }
      let btn=document.createElement('button');
      btn.id='cf-btn';
      btn.textContent='📁 Customer Folders (Photos)';
      btn.style.cssText='margin-top:12px;height:36px;padding:0 16px;border-radius:12px;background:#000;color:#fff;font-size:12px;font-weight:bold;cursor:pointer;display:block;';
      btn.onclick=toggleCF;
      h2.parentNode.insertBefore(btn, h2.nextSibling);
      let cont=document.createElement('div');
      cont.id='cf-view';
      cont.style.display='none';
      cont.className='mt-4 space-y-3 max-h-[70vh] overflow-auto';
      h2.parentNode.insertBefore(cont, btn.nextSibling);
      clearInterval(iv);
    }, 600);
  }
  
  function toggleCF(){
    let c=document.getElementById('cf-view');
    let h2=null;
    document.querySelectorAll('h2').forEach(function(h){ if(h.textContent.includes('Order History')) h2=h; });
    let orig=null;
    if(h2){
      let s=h2.nextSibling;
      while(s){
        if(s.className && s.className.indexOf('max-h-[70vh]')>=0 && s.id!=='cf-view' && s.id!=='cf-btn'){
          if(s.textContent.indexOf('YVB')>=0 || s.textContent.indexOf('No orders')>=0){ orig=s; break; }
        }
        s=s.nextSibling;
      }
    }
    if(!c) return;
    if(c.style.display==='none'){
      c.style.display='block';
      if(orig) orig.style.display='none';
      document.getElementById('cf-btn').textContent='📋 All Orders';
      renderCF();
      cfActive=true;
    } else {
      c.style.display='none';
      if(orig) orig.style.display='block';
      document.getElementById('cf-btn').textContent='📁 Customer Folders (Photos)';
      cfActive=false;
    }
  }
  
  window.renderCF = function(){
    try {
      let orders=JSON.parse(localStorage.getItem('yvb_order_history_v2')||'[]');
      orders.forEach(function(o,i){ if(!o.serial) o.serial=i+1; });
      let cont=document.getElementById('cf-view');
      if(!cont) return;
      if(orders.length===0){
        cont.innerHTML='<div style="text-align:center;padding:40px;color:#999;font-size:12px;">No orders yet</div>';
        return;
      }
      let grouped={};
      orders.forEach(function(o){
        let name=(o.customer&&o.customer.name)||'Unknown';
        if(!grouped[name]) grouped[name]=[];
        grouped[name].push(o);
      });
      let html='';
      Object.keys(grouped).sort().forEach(function(name){
        let custOrders=grouped[name].sort(function(a,b){ return (a.serial||0)-(b.serial||0); });
        let total=custOrders.reduce(function(a,b){ return a+Number(b.total||0); },0);
        let fid='cust-'+name.replace(/[^a-zA-Z0-9]/g,'-');
        html+='<div style="border:1px solid #e4e4e7;border-radius:12px;overflow:hidden;margin-bottom:12px;">';
        html+='<div style="padding:12px;background:#fafafa;display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="let e=document.getElementById(\''+fid+'\'); e.style.display=e.style.display==='none'?\'block\':\'none\'">';
        html+='<div style="display:flex;align-items:center;gap:12px;"><div style="width:40px;height:40px;border-radius:50%;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;">'+name.charAt(0).toUpperCase()+'</div><div><div style="font-weight:bold;font-size:14px;">'+name+'</div><div style="font-size:11px;color:#71717a;">'+custOrders.length+' orders • Total ₹'+total+'</div></div></div><span>▼</span></div>';
        html+='<div id="'+fid+'" style="display:none;padding:12px;background:#fff;">';
        custOrders.forEach(function(order){
          let statusColor = order.status==='Accepted' ? '#16a34a' : order.status==='Rejected' ? '#dc2626' : '#000';
          html+='<div style="border:1px solid #f4f4f5;border-radius:12px;padding:12px;margin-bottom:12px;">';
          html+='<div style="display:flex;justify-content:space-between;"><div style="font-size:11px;font-weight:bold;">#'+(order.serial||'?')+' - '+order.id+'</div><span style="font-size:10px;padding:2px 8px;border-radius:20px;background:'+statusColor+';color:#fff;">'+order.status+'</span></div>';
          html+='<div style="font-size:10px;color:#71717a;margin-top:4px;">'+order.date+' • Total ₹'+order.total+'</div>';
          html+='<div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;">';
          order.items.forEach(function(item){
            let img=item.image?'<img src="'+item.image+'" style="width:100%;height:80px;object-fit:cover;cursor:zoom-in;" onclick="window.openFullImage(\''+item.image+'\')">':'<div style="width:100%;height:80px;background:#f4f4f5;display:flex;align-items:center;justify-content:center;font-size:9px;">No Image</div>';
            html+='<div style="border:1px solid #f4f4f5;border-radius:12px;overflow:hidden;">'+img+'<div style="padding:8px;"><div style="font-size:11px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+(item.name_en||'Product')+'</div><div style="font-size:10px;color:#71717a;">Size: '+(item.size||'Free')+' • Qty: '+item.qty+'</div><div style="font-size:10px;font-weight:bold;">₹'+item.price+'</div></div></div>';
          });
          html+='</div>';
          html+='<div style="padding-top:12px;margin-top:12px;border-top:1px solid #f4f4f5;display:flex;gap:8px;flex-wrap:wrap;">';
          html+='<button onclick="window.acceptOrder(\''+order.id+'\')" style="height:32px;padding:0 12px;border-radius:20px;background:'+(order.status==='Accepted'?'#16a34a':'#000')+';color:#fff;font-size:11px;font-weight:bold;border:none;cursor:pointer;">'+(order.status==='Accepted'?'✓ Accepted':'Accept Order')+'</button>';
          if(order.status!=='Accepted' && order.status!=='Rejected'){
            html+='<button onclick="window.rejectOrder(\''+order.id+'\')" style="height:32px;padding:0 12px;border-radius:20px;background:#fff;border:1px solid #e4e4e7;color:#000;font-size:11px;font-weight:bold;cursor:pointer;">Reject</button>';
          }
          html+='<button onclick="let m=\'*Yammuna - '+name+'*%0AOrder #'+(order.serial||'')+' - '+order.id+'%0ACustomer: '+name+'%0ATotal: ₹'+order.total+'%0AStatus: '+order.status+'\'; window.open(\'https://wa.me/?text=\'+encodeURIComponent(m),\'_blank\')" style="height:32px;padding:0 12px;border-radius:20px;background:#16a34a;color:#fff;font-size:11px;font-weight:bold;border:none;cursor:pointer;">WhatsApp</button>';
          html+='</div></div>';
        });
        html+='</div></div>';
      });
      cont.innerHTML=html;
    } catch(e){ console.error(e); }
  };
  
  if(document.readyState==='complete'){ initCF(); enhanceProducts(); }
  else window.addEventListener('load', function(){ initCF(); enhanceProducts(); });
  setInterval(function(){ if(cfActive) window.renderCF(); }, 3000);
})();
</script></body>
</html>
